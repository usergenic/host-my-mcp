[package]
name = "host-my-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One public Streamable HTTP MCP gateway that authenticates with OAuth (Auth0), authorizes per server and per tool, and routes paths to local stdio MCP servers"
license = "MIT"
repository = "https://github.com/usergenic/host-my-mcp"
keywords = ["mcp", "oauth", "gateway", "proxy", "auth0"]
categories = ["web-programming::http-server", "command-line-utilities"]
readme = "README.md"
default-run = "host-my-mcp"

[[bin]]
name = "host-my-mcp"
path = "src/main.rs"

[[bin]]
name = "host-my-mcp-echo"
path = "src/bin/echo.rs"

[dependencies]
rmcp = { version = "3.5", features = [
  "server",
  "client",
  "transport-streamable-http-server",
  "transport-child-process",
  "transport-io",
] }
axum = { version = "0.8", features = ["json", "http1", "tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
http = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
globset = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
regex = "1"
schemars = "1"

[dev-dependencies]
rmcp = { version = "3.5", features = ["transport-streamable-http-client-reqwest"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
