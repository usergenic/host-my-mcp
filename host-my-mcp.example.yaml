# host-my-mcp configuration. Copy to host-my-mcp.yaml and edit.
# Environment variables are substituted with the shell-style dollar-brace syntax
# (`$` followed by `{NAME}` or `{NAME:-default}`) before the YAML is parsed.

listen:
  host: 127.0.0.1          # bind address; Zo's public service forwards to this port
  port: 8080
  # allowed_hosts: ["mcp-ph.zocomputer.io"]   # extra Host header values; ["*"] disables the check
  # allowed_origins: ["https://app.example.com:*"]

# The public origin MCP clients use. No path, no trailing slash.
public_url: https://mcp-ph.zocomputer.io

auth:
  # Auth0 tenant issuer. Keep the trailing slash exactly as Auth0 prints it.
  issuer: https://${AUTH0_TENANT}.us.auth0.com/
  # jwks_uri defaults to <issuer>.well-known/jwks.json
  # The claim that carries the user's email. Auth0 access tokens only include
  # one if an Action adds it (see README → Auth0 setup → step 7).
  email_claim: https://host-my-mcp/email
  # disabled: true          # local development only; every caller becomes `anonymous`

users:
  brendan:
    subjects:
      - "google-oauth2|${BRENDAN_GOOGLE_SUB}"   # the stable `sub`; see README "finding your sub"
    emails:
      - brendan@example.com                     # convenience match on the email claim

servers:
  # Each key becomes a path (/omg) and an OAuth resource (https://mcp-ph.zocomputer.io/omg).
  omg:
    command: omg
    args: ["mcp", "-C", "/home/zo/notes"]
    env:
      OMG_LOG: info
    allowed_users: [brendan]
    tools:
      allow: ["*"]
      deny: ["docs_delete", "repos_*"]
    # lifecycle: shared        # one child for all sessions (default) | per_session
    # start: lazy              # spawn on first use (default) | eager
    # request_timeout_secs: 300
    # restart: { max_restarts: 5, window_secs: 60, cooldown_secs: 60 }
    # filter_tool_list: true   # hide tools the caller may not invoke

  toggl:
    path: /toggl
    command: toggl-mcp
    env:
      TOGGL_API_TOKEN: ${TOGGL_API_TOKEN}
    allowed_users: [brendan]
    # Require an extra scope on the token for this resource; advertised in the
    # protected-resource metadata so clients request it up front.
    scopes: ["toggl:use"]
    tools:
      allow: ["toggl_*"]
      deny: ["toggl_clear_cache"]
    user_tools:
      brendan:
        deny: ["toggl_update_time_entry"]

  echo:
    # The bundled smoke-test backend; remove once real servers work.
    command: host-my-mcp-echo
    allowed_users: [brendan]
    tools:
      allow: ["*"]
      deny: ["admin_*", "crash"]

logging:
  level: info                # RUST_LOG overrides; try "info,audit=info,backend=warn"
  format: text               # text | json
  log_arguments: false       # include tools/call arguments in audit lines (may leak secrets)
